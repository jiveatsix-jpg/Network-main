  function setZoom(newZoom){
    newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    const cx = (mapWrap.scrollLeft + mapWrap.clientWidth/2)/zoom;
    const cy = (mapWrap.scrollTop + mapWrap.clientHeight/2)/zoom;
    zoom = newZoom;
    applyZoom();
    mapWrap.scrollLeft = cx*zoom - mapWrap.clientWidth/2;
    mapWrap.scrollTop = cy*zoom - mapWrap.clientHeight/2;
    renderMinimap();
  }

  document.getElementById('btn-zoom-in').addEventListener('click', ()=>setZoom(zoom+ZOOM_STEP));

  document.getElementById('btn-zoom-reset').addEventListener('click', ()=>setZoom(1));

  mapWrap.addEventListener('wheel', (e)=>{
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      setZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
    }
  }, {passive:false});

    const scaleX = MINI_W/MAP_W, scaleY = MINI_H/MAP_H;
    const mapX = clickX/scaleX, mapY = clickY/scaleY;
    mapWrap.scrollLeft = mapX*zoom - mapWrap.clientWidth/2;
    mapWrap.scrollTop = mapY*zoom - mapWrap.clientHeight/2;

  function parseCsvLine(line){
    const cols = [];
    let current = '', inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch === '"'){
        if(inQuotes && i+1 < line.length && line[i+1] === '"'){
          current += '"'; i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if(ch === ',' && !inQuotes){
        cols.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    cols.push(current.trim());
    return cols;
  }

  function parseCsv(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
    if(lines.length === 0) return [];
    const header = parseCsvLine(lines[0]).map(h=>h.toLowerCase());
    const idxName = header.indexOf('nombre');
    const idxType = header.indexOf('tipo');
    const idxLoc = header.indexOf('ubicacion');
    const idxRole = header.indexOf('rol');
    const rows = [];
    for(let i=1;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      const type = (idxType>=0 && TYPES.includes(cols[idxType])) ? cols[idxType] : 'persona';
      rows.push({
        name: idxName>=0 ? (cols[idxName]||'SIN NOMBRE') : (cols[0]||'SIN NOMBRE'),
        type: type,
        location: idxLoc>=0 ? (cols[idxLoc]||'') : '',
        role: idxRole>=0 ? (cols[idxRole]||'') : ''
      });
    }
    return rows;
  }

  // ================= GEOJSON IMPORT =================
  function extractGeoCoords(geometry){
    const coords = [];
    function walk(geom){
      if(geom.type === 'Polygon'){
        geom.coordinates[0].forEach(p=>coords.push({lon:p[0], lat:p[1]}));
      } else if(geom.type === 'MultiPolygon'){
        geom.coordinates.forEach(poly=>poly[0].forEach(p=>coords.push({lon:p[0], lat:p[1]})));
      }
    }
    if(Array.isArray(geometry)){ geometry.forEach(walk); }
    else { walk(geometry); }
    return coords;
  }

  function extractGeoFeatures(data){
    const features = [];
    if(data.type === 'FeatureCollection' && Array.isArray(data.features)){
      data.features.forEach(f=>{
        if(f.type === 'Feature' && f.geometry) features.push(f);
      });
    } else if(data.type === 'Feature' && data.geometry){
      features.push(data);
    } else if(data.type === 'Polygon' || data.type === 'MultiPolygon'){
      features.push({geometry:data, properties:{}});
    }
    return features;
  }

  function geoPolygonToPoints(geometry, cx, cy, scale, refLon, refLat){
    const rings = [];
    if(geometry.type === 'Polygon'){
      rings.push(geometry.coordinates[0]);
    } else if(geometry.type === 'MultiPolygon'){
      rings.push(geometry.coordinates[0][0]);
    }
    if(!rings.length) return [];
    return rings[0].map(p=>({
      x: cx + (p[0] - refLon) * scale,
      y: cy - (p[1] - refLat) * scale
    }));
  }

  document.getElementById('import-geojson-input').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(err){ setStatus('GEOJSON INVÁLIDO', true); e.target.value = ''; return; }
      const features = extractGeoFeatures(data);
      if(features.length === 0){ setStatus('SIN POLÍGONOS EN EL ARCHIVO', true); e.target.value = ''; return; }
      setStatus('PROCESANDO ' + features.length + ' POLÍGONOS...');
      setTimeout(()=>{
        let allPoints = [];
        features.forEach(f=>{
          allPoints = allPoints.concat(extractGeoCoords(f.geometry));
        });
        if(allPoints.length < 3){ setStatus('DEMASIADOS POCOS PUNTOS', true); e.target.value = ''; return; }
        const minLon = Math.min(...allPoints.map(p=>p.lon));
        const maxLon = Math.max(...allPoints.map(p=>p.lon));
        const minLat = Math.min(...allPoints.map(p=>p.lat));
        const maxLat = Math.max(...allPoints.map(p=>p.lat));
        const centerLon = (minLon + maxLon) / 2;
        const centerLat = (minLat + maxLat) / 2;
        const spanLon = maxLon - minLon || 0.001;
        const spanLat = maxLat - minLat || 0.001;
        const maxSpan = Math.max(spanLon, spanLat);
        const targetPixels = 500;
        let scale = targetPixels / maxSpan;
        scale = Math.max(80, Math.min(20000, scale));
        const viewCx = mapWrap.scrollLeft/zoom + mapWrap.clientWidth/zoom / 2;
        const viewCy = mapWrap.scrollTop/zoom + mapWrap.clientHeight/zoom / 2;
        pushUndo();
        const created = [];
        features.forEach(f=>{
          const name = f.properties && (f.properties.name || f.properties.Comuna || f.properties.nombre || f.properties.NOMBRE || f.properties.label || 'ZONA');
          const pts = geoPolygonToPoints(f.geometry, viewCx, viewCy, scale, centerLon, centerLat);
          if(pts.length < 3) return;
          const zone = {
            id: uid('z'),
            label: typeof name === 'string' ? name : 'ZONA',
            color: ZONE_COLORS[state.zones.length % ZONE_COLORS.length],
            opacity: 22,
            points: pts
          };
          state.zones.push(zone);
          created.push(zone);
        });
        if(created.length === 0){ setStatus('NO SE PUDO CREAR NINGUNA ZONA', true); }
        else {
          renderAll();
          selectZone(created[0].id);
          scheduleSave();
          setStatus(created.length + ' ZON' + (created.length>1?'AS':'A') + ' IMPORTADA' + (created.length>1?'S':''));
        }
        e.target.value = '';
      }, 30);
    };
    reader.readAsText(file);
  });

      renderTutorialStep();
    });
    document.getElementById('btn-tutorial-next').addEventListener('click', ()=>{
      if(tutorialStep === TUTORIAL_STEPS.length-1){ closeTutorial(); return; }
      tutorialStep = Math.min(TUTORIAL_STEPS.length-1, tutorialStep+1);
      renderTutorialStep();
    });
    if(!localStorage.getItem(TUTORIAL_SEEN_KEY)) openTutorial();
  }

  // ================= MODO INFO =================
  // Reutiliza los `title` que ya tienen los botones del toolbar para mostrar
  // un cuadro estilo pixel al pasar el mouse, en vez del tooltip nativo.
  const INFO_MODE_KEY = 'rot-info-mode-on';
  let infoModeActive = false;
  let infoBoxEl = null;
  let infoCurrentEl = null;

  function infoEnsureBox(){
    if(infoBoxEl) return infoBoxEl;
    infoBoxEl = document.createElement('div');
    infoBoxEl.id = 'info-tooltip-box';
    infoBoxEl.hidden = true;
    document.body.appendChild(infoBoxEl);
    return infoBoxEl;
  }

  function infoPosition(x, y){
    const box = infoEnsureBox();
    const pad = 14;
    const rect = box.getBoundingClientRect();
    let left = x + pad, top = y + pad;
    if(left + rect.width > window.innerWidth) left = x - rect.width - pad;
    if(top + rect.height > window.innerHeight) top = y - rect.height - pad;
    box.style.left = Math.max(4, left) + 'px';
    box.style.top = Math.max(4, top) + 'px';
  }

  function infoHide(){
    infoCurrentEl = null;
    infoEnsureBox().hidden = true;
  }

  function infoLabelFor(el){
    return (el.textContent || '').trim().slice(0, 40);
  }

  function infoShowFor(el, x, y){
    const text = el.getAttribute('title');
    if(!text){ infoHide(); return; }
    infoCurrentEl = el;
    const box = infoEnsureBox();
    box.textContent = '';
    const label = infoLabelFor(el);
    if(label){
      const labelEl = document.createElement('div');
      labelEl.className = 'info-tooltip-label';
      labelEl.textContent = label;
      box.appendChild(labelEl);
    }
    const textEl = document.createElement('div');
    textEl.className = 'info-tooltip-text';
    textEl.textContent = text;
    box.appendChild(textEl);
    box.hidden = false;
    infoPosition(x, y);
  }

  function initInfoTooltip(){
    const toggleBtn = document.getElementById('btn-info-toggle');
    if(!toggleBtn) return;

    document.addEventListener('mouseover', (e) => {
      if(!infoModeActive) return;
      const target = e.target.closest('[title]');
      if(!target){ infoHide(); return; }
      if(target !== infoCurrentEl) infoShowFor(target, e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e) => {
      if(!infoModeActive || !infoCurrentEl) return;
      infoPosition(e.clientX, e.clientY);
    });
    document.addEventListener('mouseout', (e) => {
      if(!infoModeActive) return;
      const target = e.target.closest('[title]');
      if(target && e.relatedTarget && target.contains(e.relatedTarget)) return;
      infoHide();
    });

    const setActive = (on) => {
      infoModeActive = on;
      localStorage.setItem(INFO_MODE_KEY, on ? 'true' : 'false');
      toggleBtn.classList.toggle('active', on);
      toggleBtn.setAttribute('aria-pressed', String(on));
      if(!on) infoHide();
    };
    toggleBtn.addEventListener('click', () => setActive(!infoModeActive));
    setActive(localStorage.getItem(INFO_MODE_KEY) === 'true');
  }

  // ================= INIT =================
  async function init(){
    setStatus('CARGANDO RED...');
    await loadMeta();
    await loadLibrary();
    updateNetworkLabel();
    applySkin(meta.skin || 'tactical', true);
    applyZoom();
    renderAll();
    if(hasCloudStorage){
      setStatus('RED CARGADA');
    } else {
      setStatus('RED CARGADA · GUARDANDO EN ESTE NAVEGADOR');
    }
    initTutorial();
    initInfoTooltip();
  }
  init();

})();
</script>
